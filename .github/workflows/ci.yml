name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run complete test suite
        run: npm test

      - name: Verify locked runtime state
        run: npm run doctor

      - name: Validate installable skill
        run: npm run check:skill

      - name: Check local documentation links
        run: npm run check:links

      - name: Validate release metadata
        run: npm run check:release

      - name: Scan release content
        run: npm run check:content

      - name: Smoke test versioned managed install
        env:
          CODEX_HOME: ${{ runner.temp }}/protected-paybox-codex-home
          XDG_DATA_HOME: ${{ runner.temp }}/protected-paybox-data
        run: |
          ./install
          "$CODEX_HOME/skills/protected-paybox/scripts/run" doctor

  release-bundle:
    name: Deterministic cold-install bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Build and cold-validate committed release
        run: npm run release:bundle
